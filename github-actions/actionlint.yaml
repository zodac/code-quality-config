# ------------------------------------------------------------------------------
# actionlint configuration - https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# actionlint only discovers a config at .github/actionlint.yaml (or .yml); from
# anywhere else, pass it with `-config-file <path>`.
#
# Every value below is actionlint's default (`actionlint -init-config`), spelled
# out so a project can see what applies and override it.
#
# actionlint also runs ShellCheck over `run:` blocks and pyflakes over Python
# ones, when either is on the PATH (both are in the official Docker image). It
# calls ShellCheck with `--norc`, so a .shellcheckrc does not apply there.
# ------------------------------------------------------------------------------

self-hosted-runner:
  # Labels of self-hosted runners, as an array of strings. Empty: only
  # GitHub-hosted runner labels are known.
  labels: []

# Configuration variables (`vars.*`) defined in the repository or organisation,
# as an array of strings. `null` disables the check; an empty array allows none.
config-variables: null

# Per-path configuration. The keys are glob patterns of paths relative to the
# repository root (always '/'-separated). `ignore` is an array of regular
# expressions; an error whose message matches one is ignored, like the `-ignore`
# command-line option.
paths:
#  .github/workflows/**/*.yml:
#    ignore: []
